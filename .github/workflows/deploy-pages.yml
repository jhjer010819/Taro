# Publishes the Vite static build with GitHub Actions Pages.
# Does not use a gh-pages branch.
# One-time repo setting: Settings → Pages → Source: GitHub Actions.
# The published artifact is dist/ and includes CNAME (taro.mymallow.cloud).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check pages
        run: npm run check

      - name: Prepare Pages output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          printf '%s\n' 'taro.mymallow.cloud' > dist/CNAME
          grep -qx 'taro.mymallow.cloud' dist/CNAME
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
