services:
  - type: web
    name: taro
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - taro.mymallow.cloud
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /og/*
        name: Cache-Control
        value: public, max-age=86400
